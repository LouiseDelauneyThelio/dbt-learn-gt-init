models:
  - name: customers
    description: One record per customer with aggregated order info
    semantic_model:
      enabled: true
    agg_time_dimension: first_order_date
    metrics:
      - name: customer_count
        description: Count of customer records.
        label: Customer Count
        type: simple
        agg: count
        expr: 1
      - name: total_orders
        description: Total orders placed by customers.
        label: Total Orders
        type: simple
        agg: sum
        expr: number_of_orders
    columns:
      - name: customer_id
        description: Primary key
        entity:
          type: primary
          name: customer
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Customer's first name"
        dimension:
          type: categorical
      - name: last_name
        description: "Customer's last name"
        dimension:
          type: categorical
      - name: first_order_date
        description: Date of the customer's first order.
        granularity: day
        dimension:
          type: time
      - name: most_recent_order_date
        description: Date of the customer's most recent order.
        granularity: day
        dimension:
          type: time
      - name: number_of_orders
        description: Count of orders placed by this customer


  - name: time_spine_daily
    description: Daily time spine for Semantic Layer time-based metrics.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Daily date used for MetricFlow time joins.
        granularity: day
