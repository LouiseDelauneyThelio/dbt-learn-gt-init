models:
  - name: stg_jaffle_shop__orders
    description: One record per order
    columns:
      - name: order_status
        description: This is where the description goes!
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "placed"
                    ,"shipped"
                    ,"completed"
                    ,"returned"
                    ,"return_pending"
                  ]
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
