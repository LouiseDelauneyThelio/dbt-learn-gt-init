models:
  - name: stg_jaffle_shop__orders
    description: One record per order
    columns:
      - name: order_status
        description: this might bea longer description
        data_tests:
          - accepted_values:
              arguments: 
                values: ["placed", "shipped", "completed", "returned", "return_pending"]
      - name: customer_id
        data_tests:          
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
        