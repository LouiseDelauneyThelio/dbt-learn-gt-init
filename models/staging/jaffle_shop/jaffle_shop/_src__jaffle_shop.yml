sources:
  - name: jaffle_shop
    description: Replica of PostGres database
    schema: jaffle_shop
    database: raw
    tables:
      - name: customers
        description: Table of customer deets
        columns:
          - name: id
            description: Primary key for customer table
            data_tests:
              - unique
              - not_null
              
      - name: orders
        config: 
          freshness:
            warn_after:
              count: 365 # "We expect data every 12 hours;" send an error after 12 hours
              period: day # Possible fields: second, minute, hour, day
            error_after:
              count: 730 # Stop the line if no data after determined period
              period: day
          loaded_at_field: _etl_loaded_at