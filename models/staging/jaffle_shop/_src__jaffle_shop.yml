sources:
  - name: jaffle_shop
    description: A replica of the postgres database
    schema: jaffle_shop
    database: raw
    tables:
      - name: customers
        columns:
          - name: id
            description: Primary key for the customer table.
            data_tests:
              - unique
              - not_null
              
      - name: orders
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 365
              period: day
          loaded_at_field: _etl_loaded_at