models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: first_name
        data_tests:
          - not_null:
              config:
                severity: warn
                warn_if: ">50"

      - name: last_name
        data_tests:
          - not_null
