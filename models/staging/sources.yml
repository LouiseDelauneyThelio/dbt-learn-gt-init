sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
      - name: orders
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: _etl_loaded_at
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  to: source('jaffle_shop', 'customers')
                  field: id
          - name: status
            data_tests:
              - accepted_values:
                  values: ['completed', 'returned', 'return_pending', 'placed', 'shipped']