sources:
  - name: jaffle_shop
    description: Source data comes from Jaffle shop
    schema: jaffle_shop
    database: raw
    tables:
      - name: customers
        description: customer dataset where one row represents a customer
      - name: orders
        description: order dataset where one row represents an order
        config:   
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: _etl_loaded_at
        columns:
          - name: id
            data_tests:
              - not_null
              - unique
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  to: source('jaffle_shop','customers')
                  field: id
          - name: status
            data_tests:
              - accepted_values:
                  values: ['placed', 'return_pending','returned','completed','shipped']